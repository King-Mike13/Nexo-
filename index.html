<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXO — Connect · Chat · Be You</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#060A1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NEXO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3FF;--surface:#FFFFFF;--ink:#0B1230;--mute:#5C6A94;--line:#D3DDF5;--acc:#2A5CFF;--onacc:#fff;--p:#FF6B57;--b:#0E8F7E;--g:#8A4DFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060A1C;--surface:#0F1635;--ink:#EAF0FF;--mute:#8E9CD0;--line:#22306B;--acc:#5B8CFF;--onacc:#060A1C}}
:root[data-theme="dark"]{--bg:#060A1C;--surface:#0F1635;--ink:#EAF0FF;--mute:#8E9CD0;--line:#22306B;--acc:#5B8CFF;--onacc:#060A1C}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.logo{font-weight:800;font-size:26px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo img{width:44px;height:44px;border-radius:22%;display:block;background:#000}
.logo i{width:26px;height:26px;border-radius:50%;border:6px solid var(--acc);display:inline-block}
.tag{font-size:13px;color:var(--mute)}
main{padding:10px 16px}
.card{background:var(--surface);border-radius:28px;padding:22px 20px;border:1px solid var(--line);position:relative;overflow:hidden}
.ring{--c:var(--p);width:84px;height:84px;border-radius:50%;border:7px solid var(--c);display:grid;place-items:center;font-size:32px;font-weight:800;transition:border-color .3s;background:var(--bg)}
.head{display:flex;gap:16px;align-items:center}
.name{font-size:26px;font-weight:800;letter-spacing:-.02em}
.id{color:var(--mute);font-size:15px}
.role{margin-top:4px;font-size:14px}
.pills{display:flex;gap:8px;margin:16px 0}
.pill{padding:9px 15px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:14px}
.pill[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:17px;margin:22px 4px 10px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ic{font-size:20px;width:28px;text-align:center}
.row .t{flex:1}
.row .t b{display:block;font-weight:600;font-size:15px}
.row .t span{font-size:13px;color:var(--mute)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked=true]{background:var(--acc)}
.sw[aria-checked=true]::after{transform:translateX(18px)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px;margin-top:16px}
.act{background:var(--bg);border-radius:18px;padding:13px 6px;font-weight:600;font-size:14px;text-align:center}
.act:first-child{background:var(--acc);color:var(--onacc)}
.note{font-size:13px;color:var(--mute);margin:10px 6px}
.btn{width:100%;background:var(--acc);color:var(--onacc);padding:15px;border-radius:18px;font-weight:600;margin-top:12px}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.person{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;background:var(--surface);border-radius:20px;border:1px solid var(--line);margin-bottom:10px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.back{font-weight:600;color:var(--acc);padding:6px 4px;margin-bottom:8px}
.qr{display:grid;grid-template-columns:repeat(21,1fr);gap:0;width:220px;height:220px;margin:6px auto 14px;padding:12px;background:#fff;border-radius:18px}
.qr b{background:#fff}.qr b.k{background:#1A1440}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.link{text-align:center;font-weight:600;font-size:16px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;padding:8px;border-radius:14px;font-size:13px;font-weight:600;color:var(--mute);display:grid;gap:2px;justify-items:center}
nav button span{font-size:20px}
nav button[aria-current=true]{color:var(--acc)}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

.chathead{display:flex;align-items:center;gap:10px;padding:4px 0 10px}
.ib{font-size:20px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.msgs{display:flex;flex-direction:column;gap:8px;padding:6px 0 14px}
.b{max-width:78%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.35}
.b small{display:block;font-size:11px;opacity:.6;margin-top:2px}
.b.them{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.b.me{background:var(--acc);color:var(--onacc);align-self:flex-end;border-bottom-right-radius:6px}
.comp{position:sticky;bottom:72px;display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px}
.comp input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);padding:8px;outline:none;font-size:16px}
.sendb{background:var(--acc);color:var(--onacc);font-size:16px}
.fi{width:100%;padding:12px 14px;margin-bottom:8px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.ring{position:relative;cursor:pointer;background-size:cover;background-position:center;flex:none}
.ring:focus-within{outline:2px solid var(--acc);outline-offset:3px}
.vh{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.cam{position:absolute;right:-8px;bottom:-8px;width:30px;height:30px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-size:14px;border:3px solid var(--surface)}
.bar{display:flex;gap:8px;margin-bottom:8px}
.bar .pill{font-size:13px;padding:7px 12px}
.b.un{opacity:.55;font-style:italic}
.b[data-unsend]{cursor:pointer}
.gc{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:6px solid hsl(var(--h) 70% 55%);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.gn{font-weight:800;font-size:17px;letter-spacing:-.01em}
.gr2{font-weight:600;background:var(--bg);padding:6px 12px;border-radius:99px;font-size:14px;white-space:nowrap;margin-left:auto}
.strow{display:flex;gap:14px;overflow-x:auto;padding:2px 4px 10px}
.sc{display:grid;justify-items:center;gap:6px;font-size:13px;font-weight:600;flex:none}
.ring.sm{width:60px;height:60px;border-width:4px;font-size:22px}
.stc{position:relative;border-radius:24px;min-height:260px;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff;overflow:hidden;margin-bottom:6px}
.stc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stt{position:relative;font-size:26px;font-weight:800;text-align:center;line-height:1.2;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.stm{position:absolute;left:16px;bottom:10px;font-size:12px;opacity:.9;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.stta{position:relative;width:100%;background:none;border:0;color:#fff;font:inherit;font-size:26px;font-weight:800;text-align:center;resize:none;outline:none;min-height:200px;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.stta::placeholder{color:rgba(255,255,255,.7)}
.sw2{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);outline:1px solid var(--line)}
.sw2[aria-pressed=true]{outline:3px solid var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 const rows=all.map(u=>{const x=(u.games||[]).find(y=>y.g===s.lb);return x&&{u,r:x.r,sc:score(s.lb,x.r)}}).filter(Boolean).sort((a,b)=>b.sc-a.sc);
 return `<h2 style="margin-top:8px">Leaderboards</h2><div class="chips" style="flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px">${gl.map(g=>`<button class="pill" style="white-space:nowrap" aria-pressed="${g===s.lb}" data-lbgame="${esc(g)}">${esc(g)}</button>`).join('')}</div>
 ${rows.map((o,k)=>`<div class="person" style="cursor:default${o.u.me?';border:2px solid var(--acc)':''}"><b style="width:28px;text-align:center;font-size:${k<3?20:15}px">${['🥇','🥈','🥉'][k]||k+1}</b><div class="av" style="background:${o.u.col};${o.u.me&&s.photo?`background-image:url(${s.photo});background-size:cover`:''}">${o.u.me&&s.photo?'':o.u.n[0]}</div><div style="flex:1;min-width:0"><b>${o.u.me?'You':esc(o.u.n)}</b><div class="id">${esc(o.u.id)}</div></div><div style="text-align:right"><b>${esc(o.r)}</b>${o.u.me?'':`<div><button class="back" style="padding:2px 0;margin:0;font-size:13px" data-chal="${o.u.i}">Challenge</button></div>`}</div></div>`).join('')}
 <p class="note">${G[s.lb]?"Ordered by the game's own rank ladder.":"No rank ladder saved for this game, so it is ordered by the number entered."} Ranks are entered by players and not verified yet.</p>`}
const BG=['#2A5CFF','#FF6B57','#0E8F7E','#8A4DFF','#1A1440'];
const live=()=>s.sts.filter(x=>Date.now()-x.t<864e5);
const ago=t=>{const h=Math.floor((Date.now()-t)/36e5);return h<1?'Just now':h+'h ago'};
function statusRow(){const mine=live().some(x=>x.who==='me'),us=PEOPLE.map((p,i)=>({p,i})).filter(o=>live().some(x=>x.who===o.i));
 return `<div style="display:flex;align-items:center;justify-content:space-between"><h2 style="margin:8px 4px 10px">Status</h2><button class="back" data-compose>+ Post status</button></div><div class="strow"><button class="sc" data-view="me"><span class="ring sm" style="--c:${mine?'var(--acc)':'var(--line)'};${s.photo?`background-image:url(${s.photo})`:''}">${s.photo?'':'S'}</span>You</button>${us.map(o=>`<button class="sc" data-view="${o.i}"><span class="ring sm" style="--c:${o.p.col}">${o.p.n[0]}</span>${esc(o.p.n.split(' ')[0])}</button>`).join('')}</div>`}
function viewer(){const u=s.view,me=u==='me',p=me?null:PEOPLE[u],l=live().filter(x=>x.who===u).sort((a,b)=>b.t-a.t);
 return `<button class="back" data-vback>‹ Status</button><h2 style="margin:0 4px 10px">${me?'Your status':esc(p.n)}</h2>`+(l.length?l.map(x=>`<div class="stc" style="background:${x.img?'#000':BG[x.bg]}">${x.img?`<img src="${x.img}" alt="Status photo">`:''}${x.text?`<div class="stt">${esc(x.text)}</div>`:''}<div class="stm">${ago(x.t)} · Visible to ${P[x.aud].label} contacts</div></div>${me?`<button class="back" data-delst="${s.sts.indexOf(x)}">Delete</button>`:`<button class="back" data-reply="${s.sts.indexOf(x)}">Reply</button>`}`).join(''):'<p class="note">No active status. Statuses disappear after 24 hours.</p>')}
function compose(){
 return `<button class="back" data-cancelst>‹ Cancel</button><h2 style="margin:0 4px 10px">New status</h2><div class="stc" style="background:${s.simg?'#000':BG[s.sbg]}">${s.simg?`<img src="${s.simg}" alt="Selected photo">`:''}<textarea id="st" class="stta" maxlength="200" placeholder="What's happening?">${esc(s.draft)}</textarea></div>
 <div class="chips">${BG.map((c,i)=>`<button class="sw2" style="background:${c}" aria-label="Background ${i+1}" aria-pressed="${i===s.sbg}" data-sbg="${i}"></button>`).join('')}<label class="pill" style="position:relative;cursor:pointer">📷 ${s.simg?'Change photo':'Add photo'}<input id="sp" class="vh" type="file" accept="image/*" aria-label="Add status photo"></label>${s.simg?'<button class="pill" data-rmsimg>Remove photo</button>':''}</div>
 <div style="font-weight:600;font-size:14px;margin-top:10px">Who can see it</div>${pills(s.saud,'saud')}
 <p class="note">Only people you've shared that card with can see it. It disappears after 24 hours.</p><button class="btn" data-poststatus>Post status</button>`}
const hue=g=>[...g].reduce((a,c)=>a*31+c.charCodeAt(0)>>>0,7)%360;
const gcard=(x,i,rm)=>`<div class="gc" style="--h:${hue(x.g)}"><div style="min-width:0"><div class="gn">${esc(x.g)}</div>${x.n?`<div class="id">${esc(x.n)}</div>`:''}</div><div class="gr2">${esc(x.r)}</div>${rm?`<button class="ib" data-delgame="${i}" aria-label="Remove ${esc(x.g)} card">✕</button>`:''}</div>`;
function chats(){
 if(s.chat===null&&s.compose)return compose();
 if(s.chat===null&&s.view!==null)return viewer();
 if(s.chat!==null){const p=PEOPLE[s.chat],f=p.n.split(' ')[0];
  return `<div class="chathead"><button class="ib" data-cback aria-label="Back">‹</button><div class="av" style="background:${p.col};width:38px;height:38px">${p.n[0]}</div><div style="flex:1"><b>${p.n}</b><div class="id" style="font-size:12px">${p.id} · online</div></div><button class="ib" data-act="Voice calling ${f} on NEXO…" aria-label="Voice call">📞</button><button class="ib" data-act="Video calling ${f} on NEXO…" aria-label="Video call">🎥</button></div>
  <div class="bar"><button class="pill" data-cas>Chatting as ${P[p.as||'personal'].label}</button><button class="pill" data-ctimer>Vanish: ${TL[p.tm||0]}</button></div>
  ${p.tm?`<p class="note" style="text-align:center">Messages vanish ${TN[p.tm]}. Everyone in this chat can see this setting.</p>`:''}
  <div class="msgs">${p.m.map((x,i)=>x[3]&&x[3]<Date.now()?'':`<div class="b ${x[0]}${x[4]?' un':''}" ${x[0]==='me'&&!x[4]?`data-unsend="${i}"`:''}>${x[4]?'Message unsent':esc(x[1])}<small>${x[2]}${x[3]&&!x[4]?' · vanishes':''}${x[0]==='me'&&!x[4]?' · tap to unsend':''}</small></div>`).join('')}</div>
  <div class="comp"><button class="ib" data-send="📎 floor_plan.pdf" aria-label="Send file">📎</button><button class="ib" data-send="📍 Location shared" aria-label="Share location">📍</button><input id="mi" placeholder="Message ${f}" autocomplete="off"><button class="ib sendb" data-sendtxt aria-label="Send">➤</button></div>`}
 return statusRow()+`<h2 style="margin-top:8px">Chats</h2>`+PEOPLE.map((p,i)=>{const v=p.m.filter(x=>!(x[3]&&x[3]<Date.now())),l=v[v.length-1]||['them','No messages',''];return `<button class="person" data-chat="${i}"><div class="av" style="background:${p.col}">${p.n[0]}</div><div style="flex:1;min-width:0"><b>${p.n}</b><div class="id" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l[0]==='me'?'You: ':''}${esc(l[1])}</div></div><span class="id">${l[2]}</span></button>`}).join('')+`<button class="btn" data-act="New group: choose people from your contacts">+ New chat or group</button><p class="note">Every message, call and file runs on NEXO. Nobody needs your phone number.</p>`}
function send(x){const i=s.chat,p=PEOPLE[i];if(!x.trim())return;p.m.push(['me',x,now(),p.tm?Date.now()+TD[p.tm]:0]);render();
 setTimeout(()=>{p.m.push(['them',p.r[Math.floor(Math.random()*p.r.length)],now(),p.tm?Date.now()+TD[p.tm]:0]);if(s.chat===i&&s.tab==='chats')render();else toast('New message from '+p.n.split(' ')[0])},1200)}
function share(){const p=P[s.shareAs];
 return `<h2 style="margin-top:8px">Share instead of your number</h2><div class="card"><div class="note" style="margin:0 0 4px;text-align:center">Sharing your <b>${p.label}</b> card</div>
 <div style="display:flex;justify-content:center">${pills(s.shareAs,'shareas')}</div>
 <div class="qr">${qr('samuel27'+s.shareAs)}</div><div class="link">nexo.me/samuel27</div>
 <p class="note" style="text-align:center">Works for people without the app.</p>
 <div style="font-weight:600;font-size:14px;margin-top:10px">Access lasts</div>
 <div class="chips">${['Always','24 hours','One use'].map(e=>`<button class="pill" aria-pressed="${e===s.expiry}" data-exp="${e}">${e}</button>`).join('')}</div></div>
 <button class="btn" data-act="Link copied. Access: ${s.expiry.toLowerCase()}">Copy link</button>
 <button class="btn alt" data-act="Meet-up mode on. Scan a friend's code to swap cards.">Meet-up mode: swap cards</button>`}
function render(){
 $('#app').innerHTML=s.tab==='chats'?chats():s.tab==='board'?board():s.tab==='card'?card():s.tab==='people'?people():share();
 if(s.tab==='chats'&&s.chat!==null){window.scrollTo(0,document.body.scrollHeight);const m=$('#mi');if(m&&window.__f){m.focus()}}
 $('#nav').innerHTML=[['chats','💬','Chats'],['people','👥','People'],['board','🏆','Ranks'],['card','🪪','My card'],['share','📲','Share']].map(([k,i,l])=>`<button data-tab="${k}" aria-current="${s.tab===k}"><span>${i}</span>${l}</button>`).join('')}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-unsend]');if(!t)return;const d=t.dataset;
 if(d.tab){s.tab=d.tab;s.person=null;s.chat=null;s.compose=0;s.view=null}
 else if(d.chat!==undefined)s.chat=+d.chat;
 else if(d.compose!==undefined){s.compose=1;s.view=null}
 else if(d.cancelst!==undefined)s.compose=0;
 else if(d.sbg!==undefined)s.sbg=+d.sbg;
 else if(d.saud)s.saud=d.saud;
 else if(d.rmsimg!==undefined)s.simg=null;
 else if(d.poststatus!==undefined){const x=($('#st').value||'').trim();if(!x&&!s.simg){toast('Add some text or a photo first');return}
  s.sts.push({who:'me',text:x,bg:s.sbg,img:s.simg,aud:s.saud,t:Date.now()});s.compose=0;s.draft='';s.simg=null;s.view='me';toast('Status posted for your '+P[s.saud].label+' contacts')}
 else if(d.view!==undefined){const v=d.view==='me'?'me':+d.view;if(v==='me'&&!live().some(x=>x.who==='me')){s.compose=1}else s.view=v}
 else if(d.vback!==undefined)s.view=null;
 else if(d.delst!==undefined){s.sts.splice(+d.delst,1);toast('Status deleted')}
 else if(d.reply!==undefined){const x=s.sts[+d.reply];s.view=null;s.tab='chats';s.chat=x.who;window.__f=0;send('Replying to your status: '+(x.text||'your photo'));return}
 else if(d.lbgame)s.lb=d.lbgame;
 else if(d.chal!==undefined){s.tab='chats';s.chat=+d.chal;window.__f=0;send('Up for a '+s.lb+' match?');return}
 else if(d.cas!==undefined){const p=PEOPLE[s.chat],k=Object.keys(P);p.as=k[(k.indexOf(p.as||'personal')+1)%k.length];toast(p.n.split(' ')[0]+' now sees your '+P[p.as].label+' card in this chat')}
 else if(d.ctimer!==undefined){const p=PEOPLE[s.chat];p.tm=((p.tm||0)+1)%3;toast(p.tm?'Messages now vanish '+TN[p.tm]:'Vanishing messages off')}
 else if(d.unsend!==undefined){PEOPLE[s.chat].m[+d.unsend][4]=1;toast('Message unsent for everyone')}
 else if(d.rmphoto!==undefined){s.photo=null;try{localStorage.removeItem('one-photo')}catch(e){}toast('Photo removed')}
 else if(d.addgame!==undefined){addGame();return}
 else if(d.delgame!==undefined)s.games.splice(+d.delgame,1);
 else if(d.cback!==undefined)s.chat=null;
 else if(d.openchat!==undefined){s.tab='chats';s.chat=+d.openchat;s.person=null}
 else if(d.send){window.__f=0;send(d.send);return}
 else if(d.sendtxt!==undefined){const m=$('#mi');window.__f=1;send(m.value);return}
 else if(d.persona)s.persona=d.persona;
 else if(d.shareas)s.shareAs=d.shareas;
 else if(d.exp){s.expiry=d.exp}
 else if(d.sw!==undefined){const i=+d.sw,f=P[s.persona].fields[i];s.on[key(s.persona,i)]=!isOn(s.persona,i,f[3]);toast(s.on[key(s.persona,i)]?f[1]+' is visible on this card':f[1]+' is hidden on this card')}
 else if(d.person!==undefined)s.person=+d.person;
 else if(d.back!==undefined)s.person=null;
 else if(d.update!==undefined){toast(PEOPLE[+d.update].n.split(' ')[0]+"'s number changed. Your saved card updated by itself.");return}
 else if(d.act){toast(d.act);return}
 render()});
document.addEventListener('change',e=>{if(e.target.id==='pf'){const fl=e.target.files[0];if(!fl)return;
 if(!fl.type.startsWith('image/')){toast('Choose an image file (JPG, PNG or similar)');return}
 const rd=new FileReader();rd.onerror=()=>toast('Could not read that file. Try another photo.');
 rd.onload=()=>{const im=new Image();im.onerror=()=>toast('That image could not be opened. Try a JPG or PNG.');
  im.onload=()=>{const z=320,c=document.createElement('canvas');c.width=c.height=z;const m=Math.min(im.width,im.height);
   c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);s.photo=c.toDataURL('image/jpeg',.85);
   try{localStorage.setItem('one-photo',s.photo)}catch(x){}render();toast('Profile photo updated')};im.src=rd.result};
 rd.readAsDataURL(fl);return}
if(e.target.id==='gg'){s.pick=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='gr'||e.target.id==='go'))addGame();if(e.key==='Enter'&&e.target.id==='mi'){window.__f=1;send(e.target.value)}});
document.addEventListener('input',e=>{if(e.target.id==='st')s.draft=e.target.value});
document.addEventListener('change',e=>{if(e.target.id!=='sp')return;const fl=e.target.files[0];if(!fl)return;
 if(!fl.type.startsWith('image/')){toast('Choose an image file');return}
 const rd=new FileReader();rd.onerror=()=>toast('Could not read that file');
 rd.onload=()=>{const im=new Image();im.onerror=()=>toast('That image could not be opened');
  im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
   c.getContext('2d').drawImage(im,0,0,c.width,c.height);s.simg=c.toDataURL('image/jpeg',.8);render()};im.src=rd.result};rd.readAsDataURL(fl)});
setInterval(()=>{if(s.tab==='chats'&&s.chat!==null){const p=PEOPLE[s.chat],n=Date.now();if(p.m.some(x=>x[3]&&x[3]<n&&!x[5])){p.m.forEach(x=>{if(x[3]&&x[3]<n)x[5]=1});const m0=$('#mi'),v=m0?m0.value:'',f=document.activeElement===m0;render();const m=$('#mi');if(m){m.value=v;if(f)m.focus()}}}},1000);
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
render();
</script>
</body>
</html>
